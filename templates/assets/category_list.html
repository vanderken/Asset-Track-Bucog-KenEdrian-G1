{% extends "base.html" %}
{% block content %}
<h3 class="mb-4">Categories</h3>
<div class="row g-4">
  <div class="col-md-5">
    <div class="at-card p-3">
      <h6>Add Category</h6>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-2">
            <label class="form-label small">{{ field.label }}</label>
            {{ field }}
          </div>
        {% endfor %}
        <button class="btn btn-at-primary w-100 mt-2">Add</button>
      </form>
    </div>
  </div>
  <div class="col-md-7">
    <div class="at-card p-3">
      <table class="table table-sm">
        <thead><tr><th>Name</th><th>Custom?</th></tr></thead>
        <tbody>
        {% for c in categories %}
          <tr><td>{{ c.name }}</td><td>{% if c.is_custom %}Yes{% else %}No{% endif %}</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
